version: '3.8'

services:
  evolution-go:
    build:
      context: .
      dockerfile: Dokploy.Dockerfile
    container_name: evolution-go
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-4000}:${SERVER_PORT:-4000}"
    environment:
      SERVER_PORT: "${SERVER_PORT:-4000}"
      CLIENT_NAME: "evolution"
      GLOBAL_API_KEY: "${GLOBAL_API_KEY}"
      POSTGRES_AUTH_DB: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:${PGPORT:-5432}/evogo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:${PGPORT:-5432}/evogo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false"
      WADEBUG: "INFO"
      LOGTYPE: "console"
      LOG_DIRECTORY: "/app/logs"
      LOG_MAX_SIZE: "100"
      LOG_MAX_BACKUPS: "5"
      LOG_MAX_AGE: "30"
      LOG_COMPRESS: "true"
      CONNECT_ON_STARTUP: "false"
      WEBHOOK_FILES: "true"
      OS_NAME: "Linux"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      AMQP_URL: "${AMQP_URL:-}"
      AMQP_GLOBAL_ENABLED: "false"
      NATS_URL: "${NATS_URL:-}"
      NATS_GLOBAL_ENABLED: "false"
      MINIO_ENABLED: "false"
      PROXY_HOST: "${PROXY_HOST:-}"
      PROXY_PORT: "${PROXY_PORT:-}"
      PROXY_USERNAME: "${PROXY_USERNAME:-}"
      PROXY_PASSWORD: "${PROXY_PASSWORD:-}"
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"
      QRCODE_MAX_COUNT: "5"
    volumes:
      - evolution_go_data:/app/dbdata
      - evolution_go_logs:/app/logs
    networks:
      - evolution_network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      PGPORT: ${PGPORT:-5432}
    ports:
      - "${PG_PORT:-5432}:${PG_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evolution_data:
    driver: local
  evolution_logs:
    driver: local
  postgres_data:
    driver: local

networks:
  evolution_network:
    driver: bridge